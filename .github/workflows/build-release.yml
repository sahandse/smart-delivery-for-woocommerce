name: Build Plugin ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'smart-delivery-for-woocommerce.php'
      - 'admin/**'
      - 'assets/**'
      - 'includes/**'
      - 'public/**'
      - 'readme.txt'
      - '.github/workflows/build-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare plugin
        run: |
          rm -rf build
          mkdir -p build/smart-delivery-for-woocommerce
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/smart-delivery-for-woocommerce/

      - name: Lint PHP
        run: find build/smart-delivery-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Create ZIP
        run: |
          cd build
          zip -r smart-delivery-for-woocommerce.zip smart-delivery-for-woocommerce

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-delivery-for-woocommerce-1.4.2
          path: build/smart-delivery-for-woocommerce.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/smart-delivery-for-woocommerce.zip
          generate_release_notes: true
