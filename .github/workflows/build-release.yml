name: Build Plugin ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'smart-delivery-for-woocommerce.php'
      - 'admin/**'
      - 'assets/**'
      - 'includes/**'
      - 'public/**'
      - 'readme.txt'
      - '.github/workflows/build-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply 1.4.3 release normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('smart-delivery-for-woocommerce.php')
          text = main.read_text(encoding='utf-8')
          text = text.replace('Version: 1.4.2', 'Version: 1.4.3')
          text = text.replace("define( 'SDW_VERSION', '1.4.2' );", "define( 'SDW_VERSION', '1.4.3' );")
          main.write_text(text, encoding='utf-8')

          checkout = Path('public/class-sdw-checkout.php')
          text = checkout.read_text(encoding='utf-8')
          text = text.replace("SDW_Core::text('روز کاری','Working day')", "SDW_Core::text('قابل ارسال','Available')")
          checkout.write_text(text, encoding='utf-8')
          PY

      - name: Commit normalized release files
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add smart-delivery-for-woocommerce.php public/class-sdw-checkout.php
          git diff --cached --quiet || git commit -m "release: Smart Delivery 1.4.3"
          git push

      - name: Prepare plugin
        run: |
          rm -rf build
          mkdir -p build/smart-delivery-for-woocommerce
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/smart-delivery-for-woocommerce/

      - name: Lint PHP
        run: find build/smart-delivery-for-woocommerce -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Create ZIP
        run: |
          cd build
          zip -r smart-delivery-for-woocommerce.zip smart-delivery-for-woocommerce

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-delivery-for-woocommerce-1.4.3
          path: build/smart-delivery-for-woocommerce.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/smart-delivery-for-woocommerce.zip
          generate_release_notes: true
